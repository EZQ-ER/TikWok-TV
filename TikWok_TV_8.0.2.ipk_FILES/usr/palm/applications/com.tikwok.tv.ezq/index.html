<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>TikWok TV</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden;cursor:default}
body.nocur,body.nocur *{cursor:none}
svg{display:block;fill:currentColor}
#bg{position:absolute;left:-60px;top:-40px;width:520px;height:300px;background:#1b1b1b center/cover no-repeat;
  -webkit-filter:blur(12px) saturate(1.5);filter:blur(12px) saturate(1.5);
  -webkit-transform-origin:0 0;transform-origin:0 0;-webkit-transform:scale(4);transform:scale(4)}
#shade{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.12) 0,rgba(0,0,0,0) 35%,rgba(0,0,0,.55) 78%,rgba(0,0,0,.85) 100%)}
#v{position:absolute;left:50%;top:0;width:608px;height:100%;margin-left:-304px;object-fit:contain;background:#000}
#sl{position:absolute;left:50%;top:0;width:608px;height:100%;margin-left:-304px;object-fit:contain;background:#000;display:none}
body.fill #sl{left:0;width:100%;margin-left:0;object-fit:cover}
body.fill #v{left:0;width:100%;margin-left:0;object-fit:cover}
#info{position:absolute;left:64px;bottom:118px;width:520px;z-index:6;text-shadow:0 2px 10px rgba(0,0,0,.55);-webkit-transition:opacity .2s;transition:opacity .2s}
body.menuopen #info{opacity:0}
#nick{font-size:34px;font-weight:700;margin-bottom:12px;word-break:break-word}
#cap{font-size:42px;line-height:1.16;font-weight:700;color:#f0f0f0;max-height:4.7em;overflow:hidden;word-break:break-word}
#music{font-size:24px;color:#d2d2d2;margin-top:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stats{font-size:24px;color:#5a78ee;margin-top:10px}
#state{position:absolute;right:48px;top:40px;font-size:25px;color:#5a78ee;z-index:6;text-shadow:0 1px 6px rgba(0,0,0,.8)}
#actions{z-index:6;position:absolute;left:50%;bottom:30px;width:1000px;margin-left:-500px;display:none;flex-direction:row;justify-content:center;align-items:flex-start}
.a{width:250px;display:flex;flex-direction:column;align-items:center;cursor:pointer;text-shadow:0 1px 5px rgba(0,0,0,.8)}
.ico{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;-webkit-transition:-webkit-transform .12s,background .12s;transition:transform .12s,background .12s}
.ico svg{width:58px;height:58px;filter:drop-shadow(0 1px 4px rgba(0,0,0,.55))}
.a.foc .ico{background:#fff;color:#111;-webkit-transform:scale(1.14);transform:scale(1.14)}
.a.foc .ico svg{filter:none}
.a.liked .ico svg{color:#9508bb}
.al{margin-top:12px;height:34px;font-size:27px;font-weight:700;opacity:0;white-space:nowrap}
.al{opacity:0}
.a.foc .al{opacity:1}
body.zv #v,body.zv #sl{outline:4px solid rgba(255,255,255,.55);outline-offset:-4px}
#avw{position:relative;width:80px;height:80px;margin:8px 0;border-radius:50%;-webkit-transition:-webkit-transform .12s,box-shadow .12s;transition:transform .12s,box-shadow .12s}
.a.foc #avw{-webkit-transform:scale(1.18);transform:scale(1.18);box-shadow:0 0 0 6px #fff}
#av{width:80px;height:80px;border-radius:50%;background:#333;border:3px solid #fff;object-fit:cover;display:block}
#plus{position:absolute;left:50%;bottom:-12px;margin-left:-14px;width:28px;height:28px;border-radius:50%;background:#9508bb;color:#fff;font-size:24px;line-height:27px;text-align:center;font-weight:700}
#plus.on{background:#fff;color:#9508bb}
/* hidden menu: press LEFT */
#left{position:absolute;left:0;top:0;bottom:0;width:480px;padding:48px 40px;display:flex;flex-direction:column;justify-content:space-between;background:rgba(14,14,14,.95);z-index:15;-webkit-transform:translateX(-100%);transform:translateX(-100%);-webkit-transition:-webkit-transform .2s;transition:transform .2s}
body.menuopen #left{-webkit-transform:none;transform:none}

#rail{width:360px}
.r{display:flex;align-items:center;height:52px;margin:0 0 2px;padding:0 18px;border-radius:26px;font-size:26px;font-weight:600;color:#e8e8e8;cursor:pointer;border:3px solid transparent}
.r svg{width:30px;height:30px;margin-right:18px;flex:none}
.r.cur{color:#9508bb}
.r.foc{background:#fff;color:#000;border-color:#fff}
.r.foc.cur{color:#9508bb}
.r.search{background:rgba(255,255,255,.14);height:58px;margin-bottom:14px;font-weight:400}
.r.search.foc{background:#fff}
.r.search input{flex:1;min-width:0;font:inherit;font-size:27px;color:inherit;background:transparent;border:0;outline:0;padding:0;height:56px}
.r.search input::placeholder{color:#aaa}
.r.search.foc input::placeholder{color:#777}
.r.search.typing{background:#fff;color:#000;border-color:#5a78ee}
#bar{position:absolute;left:0;bottom:0;height:7px;width:100%;background:rgba(255,255,255,.18)}
#barf{display:block;height:100%;width:0;background:#9508bb}
#pausedIcon{position:absolute;left:50%;top:50%;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;pointer-events:none}
#pausedIcon svg{width:64px;height:64px;margin-left:8px}
#edgehint{position:absolute;left:18px;top:50%;margin-top:-20px;font-size:23px;color:#fff;background:rgba(0,0,0,.55);padding:8px 16px;border-radius:20px;display:none;pointer-events:none}

#center{position:absolute;left:0;right:0;top:0;bottom:0;display:none;align-items:center;justify-content:center;text-align:center;padding:0 22%;font-size:38px;line-height:1.45;background:rgba(0,0,0,.6);white-space:pre-line;z-index:5}
#toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:rgba(24,24,24,.95);border:2px solid #3a3a3a;border-radius:30px;padding:14px 34px;font-size:29px;display:none;white-space:nowrap;max-width:1500px;overflow:hidden;text-overflow:ellipsis;z-index:30}

/* centre modal: search results, settings, log in */
#menu{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1080px;background:#121212;border:2px solid #333;border-radius:26px;padding:30px 36px 26px;display:none;z-index:20;box-shadow:0 20px 80px rgba(0,0,0,.8)}
#menu h2{margin:0 0 6px;font-size:36px}
#menu .note{font-size:24px;color:#aaa;line-height:1.4;margin:4px 0 14px;white-space:pre-line}
.m{font-size:29px;padding:8px 24px;margin:5px 0;min-height:70px;border-radius:35px;border:3px solid transparent;display:flex;justify-content:space-between;align-items:center;cursor:pointer;color:#eee}
.m.sel{background:#fff;color:#000;border-color:#fff}
.m span.val{color:#5a78ee;margin-left:20px;white-space:nowrap}
.m.sel span.val{color:#d4153f;font-weight:700}
.lab{display:flex;align-items:center;min-width:0}
.lab img{width:52px;height:52px;border-radius:50%;margin-right:18px;object-fit:cover;background:#333;flex:none}
.lab>span{min-width:0}
.lab small{white-space:normal;max-height:2.6em;overflow:hidden;line-height:1.3;display:block;font-size:21px;color:#999;margin-top:2px}
.m.sel .lab>span{min-width:0}
.lab small{white-space:normal;max-height:2.6em;overflow:hidden;line-height:1.3;color:#555}
.more{height:26px;font-size:20px;color:#777;text-align:center}
#mh{font-size:22px;color:#888;margin-top:8px;white-space:pre}

#boot{position:absolute;left:0;top:0;width:100%;height:100%;background:#000;z-index:50}

/* ---------- loading animation: two dots (cyan + red) trading places ---------- */
#boot{display:flex;align-items:center;justify-content:center}
.ld{position:relative;width:150px;height:56px}
.ld i{position:absolute;top:8px;width:40px;height:40px;border-radius:50%;mix-blend-mode:screen}
.ld i:nth-child(1){background:#1a3584;-webkit-animation:ldA 1.1s cubic-bezier(.45,0,.55,1) infinite;animation:ldA 1.1s cubic-bezier(.45,0,.55,1) infinite}
.ld i:nth-child(2){background:#9508bb;-webkit-animation:ldB 1.1s cubic-bezier(.45,0,.55,1) infinite;animation:ldB 1.1s cubic-bezier(.45,0,.55,1) infinite}
@-webkit-keyframes ldA{0%{left:0;-webkit-transform:scale(1)}25%{left:55px;-webkit-transform:scale(.7)}50%{left:110px;-webkit-transform:scale(1)}75%{left:55px;-webkit-transform:scale(1.25)}100%{left:0;-webkit-transform:scale(1)}}
@-webkit-keyframes ldB{0%{left:110px;-webkit-transform:scale(1)}25%{left:55px;-webkit-transform:scale(1.25)}50%{left:0;-webkit-transform:scale(1)}75%{left:55px;-webkit-transform:scale(.7)}100%{left:110px;-webkit-transform:scale(1)}}
@keyframes ldA{0%{left:0;transform:scale(1)}25%{left:55px;transform:scale(.7)}50%{left:110px;transform:scale(1)}75%{left:55px;transform:scale(1.25)}100%{left:0;transform:scale(1)}}
@keyframes ldB{0%{left:110px;transform:scale(1)}25%{left:55px;transform:scale(1.25)}50%{left:0;transform:scale(1)}75%{left:55px;transform:scale(.7)}100%{left:110px;transform:scale(1)}}

.r.btn{justify-content:center;background:#9508bb;color:#fff;height:56px;margin-top:16px;border-radius:10px;font-size:27px}
.r.btn.foc{background:#fff;color:#9508bb;border-color:#9508bb}
#foot{margin-top:20px;padding-left:6px;font-size:21px;line-height:1.7;color:#9a9a9a}
#foot div:last-child{margin-top:4px;font-size:19px;color:#7d7d7d}
#pos{display:none!important}
.r.btn span{font-size:24px}
#lgo{display:flex;flex-direction:column;align-items:center}#cb{width:300px;height:300px;border-radius:50%;background:#000;border:8px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px rgba(26,53,132,.55),0 0 0 16px rgba(149,8,187,.5)}#tw{margin-top:70px;font-size:120px;font-weight:700;letter-spacing:4px;color:#fff}#tw b{color:#9508bb}#orig{position:absolute;right:48px;bottom:36px;font-size:30px;color:#bbb;letter-spacing:2px}
#sp{position:relative;width:1080px;height:1080px}#sp img{display:block}.sd{position:absolute;left:402px;top:521px;width:114px;height:34px}.sd i{position:absolute;top:0;width:34px;height:34px;border-radius:50%;mix-blend-mode:screen}.sd i:nth-child(1){background:#1a3584;-webkit-animation:sdA 1.1s cubic-bezier(.45,0,.55,1) infinite;animation:sdA 1.1s cubic-bezier(.45,0,.55,1) infinite}.sd i:nth-child(2){background:#9508bb;-webkit-animation:sdB 1.1s cubic-bezier(.45,0,.55,1) infinite;animation:sdB 1.1s cubic-bezier(.45,0,.55,1) infinite}@-webkit-keyframes sdA{0%{left:0;-webkit-transform:scale(1)}25%{left:40px;-webkit-transform:scale(.7)}50%{left:80px;-webkit-transform:scale(1)}75%{left:40px;-webkit-transform:scale(1.25)}100%{left:0;-webkit-transform:scale(1)}}@keyframes sdA{0%{left:0;transform:scale(1)}25%{left:40px;transform:scale(.7)}50%{left:80px;transform:scale(1)}75%{left:40px;transform:scale(1.25)}100%{left:0;transform:scale(1)}}@-webkit-keyframes sdB{0%{left:80px;-webkit-transform:scale(1)}25%{left:40px;-webkit-transform:scale(1.25)}50%{left:0;-webkit-transform:scale(1)}75%{left:40px;-webkit-transform:scale(.7)}100%{left:80px;-webkit-transform:scale(1)}}@keyframes sdB{0%{left:80px;transform:scale(1)}25%{left:40px;transform:scale(1.25)}50%{left:0;transform:scale(1)}75%{left:40px;transform:scale(.7)}100%{left:80px;transform:scale(1)}}</style></head>
<body>
<div id="bg"></div><div id="shade"></div>
<video id="v" playsinline webkit-playsinline preload="auto"></video><img id="sl" alt="">
<div id="boot"><div id="sp"><img src="splashlogo.jpg" width="1080" height="1080"><div class="sd"><i></i><i></i></div></div><div id="orig">Original from EZQ</div></div>

<div id="left">
  <nav id="rail">
    <div class="r search" data-r="search">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input id="q" type="text" placeholder="Search" maxlength="80" autocomplete="off" spellcheck="false">
    </div>
    <div class="r" data-r="foryou"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>For You</span></div>
    <div class="r" data-r="explore"><svg viewBox="0 0 24 24"><path d="M12 10.9c-.61 0-1.1.49-1.1 1.1s.49 1.1 1.1 1.1c.61 0 1.1-.49 1.1-1.1s-.49-1.1-1.1-1.1zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm2.19 12.19L6 18l3.81-8.19L18 6l-3.81 8.19z"/></svg><span>Explore</span></div>
    <div class="r" data-r="minidramas"><svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg><span>Mini dramas</span></div>
    <div class="r" data-r="live"><svg viewBox="0 0 24 24"><path d="M21 6h-7.59l3.29-3.29L16 2l-4 4-4-4-.71.71L10.59 6H3c-1.1 0-2 .89-2 2v12c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.11-.9-2-2-2zm0 14H3V8h18v12z"/></svg><span>LIVE</span></div>
    <div class="r" data-r="profile"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>Profile</span></div>
    <div class="r" data-r="more"><svg viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg><span>More</span></div>
    <div class="r btn" data-r="login"><span>Switch to Web</span></div>
  </nav>
  <div id="foot"><div>Company</div><div>Program</div><div>Terms &amp; Policies</div><div>TikWok TV by EZQ</div></div>
</div>

<div id="info"><div id="nick"></div><div id="cap"></div><div id="music"></div><div id="stats"></div></div>
<div id="pos"></div><div id="state"></div>

<div id="actions">
  <div class="a" data-a="follow"><div id="avw"><img id="av" alt=""><div id="plus">+</div></div><div class="al">Follow</div></div>
  <div class="a" data-a="like" id="a_like"><div class="ico"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div><div class="al"><span id="lk">0</span></div></div>
  <div class="a" data-a="comments"><div class="ico"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 5.92 2 10.75c0 2.55 1.27 4.84 3.3 6.44L4.5 22l4.7-2.55c.9.2 1.8.3 2.8.3 5.52 0 10-3.92 10-8.75S17.52 2 12 2zM7.5 12a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5zm4.5 0a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5zm4.5 0a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5z"/></svg></div><div class="al">Comments <span id="cm">0</span></div></div>
  <div class="a" data-a="more"><div class="ico"><svg viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></div><div class="al">More</div></div>
</div>

<div id="pausedIcon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
<div id="edgehint"></div>
<div id="bar"><i id="barf"></i></div>
<div id="center"></div>
<div id="toast"></div>
<div id="menu"></div>
<script src="app.js"></script>
</body></html>
